name: Deploy to Salesforce Org

on:
  push:
    branches:
      - main

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Setup Python environment
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. Install Salesforce CLI
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      # 4. Create server.key file from GitHub Secret
      - name: Save JWT Key File
        run: echo "${{ secrets.SF_JWT_KEY }}" > server.key

      # 5. Authenticate to Salesforce Org using JWT
      - name: Authenticate to Salesforce
        run: |
          sf org login jwt \
            --client-id ${{ secrets.SF_CONSUMER_KEY }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME }} \
            --instance-url ${{ secrets.SF_INSTANCE_URL }} \
            --set-default

      # 6. Run Dry-Run Validation (do NOT let the step fail the job here —
      #    we want to inspect the JSON ourselves and print a proper reason)
      - name: Run Dry-Run Validation
        id: validate
        run: |
          set +e
          sf project deploy start \
            --source-dir force-app \
            --test-level RunLocalTests \
            --dry-run \
            --json > deploy_result.json
          echo "sf_exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      # 7. Check validation result FIRST. Only if it truly succeeded do we
      #    move on to the coverage gate.
      - name: Check Validation Result
        id: check_validation
        run: |
          python3 <<'EOF'
          import json, os, sys

          sf_exit_code = int(os.environ.get("SF_EXIT_CODE", "1"))

          if not os.path.exists("deploy_result.json") or os.path.getsize("deploy_result.json") == 0:
              print("=" * 60)
              print("ERROR: No deploy_result.json produced by sf CLI.")
              print("The Salesforce CLI likely crashed or auth failed.")
              print("=" * 60)
              sys.exit(1)

          try:
              with open("deploy_result.json") as f:
                  data = json.load(f)
          except json.JSONDecodeError as e:
              print("ERROR: deploy_result.json is not valid JSON:", e)
              sys.exit(1)

          result = data.get("result", {})
          # 'result' can be a plain string on hard failures (e.g. auth/org errors)
          result_success = None
          if isinstance(result, dict):
              result_success = result.get("success")

          validation_failed = (
              sf_exit_code != 0
              or isinstance(result, str)
              or result_success is False
          )

          if validation_failed:
              print("=" * 60)
              print("VALIDATION FAILED - deployment will NOT proceed")
              print("=" * 60)
              print("Top-level message:", data.get("message", "No top-level error message."))

              if isinstance(result, str):
                  print("Result:", result)

              if isinstance(result, dict):
                  details = result.get("details", {})

                  comp_failures = details.get("componentFailures", [])
                  if isinstance(comp_failures, dict):
                      comp_failures = [comp_failures]
                  if comp_failures:
                      print("\nComponent Failures:")
                      for cf in comp_failures:
                          print(f"  - {cf.get('problemType')}: {cf.get('fileName')} "
                                f"-> {cf.get('problem')}")

                  test_result = details.get("runTestResult", {})
                  test_failures = test_result.get("failures", [])
                  if isinstance(test_failures, dict):
                      test_failures = [test_failures]
                  if test_failures:
                      print("\nApex Test Failures:")
                      for tf in test_failures:
                          print(f"  - {tf.get('name')}.{tf.get('methodName')}: "
                                f"{tf.get('message')}")
                          if tf.get("stackTrace"):
                              print(f"    stackTrace: {tf.get('stackTrace')}")

                  code_cov_warnings = details.get("runTestResult", {}).get("codeCoverageWarnings", [])
                  if code_cov_warnings:
                      print("\nCode Coverage Warnings:")
                      for w in code_cov_warnings:
                          print(f"  - {w.get('name', '')}: {w.get('message')}")

              sys.exit(1)

          print("Validation succeeded. Proceeding to coverage check.")
          EOF
        env:
          SF_EXIT_CODE: ${{ steps.validate.outputs.sf_exit_code }}

      # 8. Coverage gate — only runs because step 7 exits 1 (and job stops)
      #    on any validation failure. This step only ever sees a passing validation.
      - name: Check Code Coverage Threshold (>= 85%)
        run: |
          python3 <<'EOF'
          import json, sys

          with open("deploy_result.json") as f:
              data = json.load(f)

          result = data.get("result", {})
          details = result.get("details", {}) if isinstance(result, dict) else {}
          test_result = details.get("runTestResult", {})
          code_coverage = test_result.get("codeCoverage", [])

          if not code_coverage:
              print("ERROR: No code coverage data found in validation result.")
              sys.exit(1)

          total_lines = 0
          total_uncovered = 0
          for item in code_coverage:
              locs = item.get("numLocations", 0)
              uncovered = item.get("numLocationsNotCovered", 0)
              total_lines += len(locs) if isinstance(locs, list) else int(locs)
              total_uncovered += len(uncovered) if isinstance(uncovered, list) else int(uncovered)

          coverage = 0.0 if total_lines == 0 else ((total_lines - total_uncovered) / total_lines) * 100
          print(f"Calculated Code Coverage: {coverage:.2f}%")

          if coverage < 85.0:
              print("=" * 60)
              print(f"ERROR: Code coverage is {coverage:.2f}%, below the required 85%.")
              print("=" * 60)

              class_coverage = sorted(
                  code_coverage,
                  key=lambda i: (
                      (len(i.get("numLocationsNotCovered", []))
                       if isinstance(i.get("numLocationsNotCovered"), list)
                       else int(i.get("numLocationsNotCovered", 0)))
                  ),
                  reverse=True,
              )
              print("\nLowest-covered components (most uncovered lines first):")
              for item in class_coverage[:10]:
                  name = item.get("name", "unknown")
                  locs = item.get("numLocations", 0)
                  unc = item.get("numLocationsNotCovered", 0)
                  n_locs = len(locs) if isinstance(locs, list) else int(locs)
                  n_unc = len(unc) if isinstance(unc, list) else int(unc)
                  pct = 0.0 if n_locs == 0 else ((n_locs - n_unc) / n_locs) * 100
                  print(f"  - {name}: {pct:.2f}% ({n_unc} uncovered of {n_locs})")

              sys.exit(1)

          print(f"SUCCESS: Code coverage is {coverage:.2f}% (>= 85%). Proceeding to deploy.")
          EOF

      # 9. Deploy only runs if steps 7 AND 8 both exited 0
      - name: Deploy Source to Salesforce Org
        run: |
          sf project deploy start \
            --source-dir force-app \
            --wait 30

      # 10. Clean up temporary files (always runs, even on failure)
      - name: Clean up Key File
        if: always()
        run: rm -f server.key deploy_result.json